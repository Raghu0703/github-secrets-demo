
name: GitHub Secrets Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Access GitHub Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_KEY }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "Secret is not configured!"
            exit 1
          fi

          echo "Secret accessed successfully!"
          echo "Secret is available in the workflow."
